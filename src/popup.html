<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hdr">
      <img class="hdr-logo" src="icons/32.png" alt="" width="22" height="22" />
      <h1 class="hdr-title" data-i18n="extName">Force YouTube Resolution</h1>
      <button id="reapply" class="icon-btn" type="button" data-i18n-title="btnApplyNow" title="Apply now">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path
            fill="currentColor"
            d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"
          />
        </svg>
      </button>
    </header>

    <section class="card status">
      <div class="status-head">
        <span class="status-label" data-i18n="nowPlaying">Now playing</span>
        <span id="videoTitle" class="status-title">—</span>
      </div>
      <div class="chips">
        <span class="chip">
          <span class="chip-key" data-i18n="currentQuality">Current</span>
          <b id="currentQuality" class="chip-val">—</b>
        </span>
        <span class="chip chip-forced">
          <span class="chip-key" data-i18n="forcedQuality">Forced</span>
          <b id="forcedQuality" class="chip-val">—</b>
        </span>
      </div>
      <p id="statusHint" class="hint" data-i18n="hintNoPlayer">
        Open a YouTube video to see the resolutions it offers.
      </p>
    </section>

    <fieldset class="picker">
      <legend class="picker-legend" data-i18n="forcedResolution">Forced resolution</legend>
      <div id="options" class="options"></div>
    </fieldset>

    <footer class="ftr">
      <span data-i18n="footnote">Applies to every YouTube tab and video.</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
