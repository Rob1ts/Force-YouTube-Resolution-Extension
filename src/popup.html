<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Force YouTube Resolution</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="app">
        <header class="hero">
            <img class="logo" src="icons/icon48.png" width="42" height="42" alt="">
            <div class="hero-copy">
                <h1>Force YouTube Resolution</h1>
                <p>Keep YouTube at your chosen quality</p>
            </div>
            <span class="version" id="version" aria-hidden="true"></span>
        </header>

        <section class="panel" aria-label="Settings">
            <div class="setting-row">
                <div class="setting-copy">
                    <span class="setting-title" id="toggleLabel">Force quality</span>
                    <span class="setting-hint">Overrides YouTube's automatic choice</span>
                </div>
                <button class="switch" id="toggle" type="button" role="switch"
                        aria-checked="true" aria-labelledby="toggleLabel">
                    <span class="switch-knob" aria-hidden="true"></span>
                </button>
            </div>

            <div class="divider" aria-hidden="true"></div>

            <div class="quality-field">
                <label class="setting-title" for="quality">Maximum resolution</label>
                <div class="select-shell">
                    <select id="quality" aria-describedby="qualityHint"></select>
                    <span class="select-arrow" aria-hidden="true"></span>
                </div>
                <p class="setting-hint" id="qualityHint">Uses the highest resolution the video offers.</p>
            </div>
        </section>

        <section class="status is-waiting" id="statusCard" aria-live="polite" aria-atomic="true">
            <div class="status-top">
                <span class="status-dot" aria-hidden="true"></span>
                <span class="status-title" id="statusTitle">Checking status&hellip;</span>
                <span class="status-chip" id="statusChip" hidden></span>
            </div>
            <p class="status-detail" id="statusDetail">Looking for a YouTube video&hellip;</p>
            <div class="status-meta" id="statusMeta" hidden></div>
        </section>

        <footer class="footer">
            <span class="footer-dot" aria-hidden="true"></span>
            <span id="footerText">Settings are saved automatically</span>
        </footer>
    </main>

    <script src="core.js"></script>
    <script src="popup.js"></script>
</body>
</html>
